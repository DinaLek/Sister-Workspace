name: Refresh Diet Angel Dashboard

on:
  schedule:
    - cron: "0 5 * * *"   # 08:00 Israel (summer)
    - cron: "0 10 * * *"  # 13:00 Israel (summer)
    - cron: "0 16 * * *"  # 19:00 Israel (summer)
  workflow_dispatch:    # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run refresh script
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python tools/scripts/refresh_diet_angel.py

      - name: Commit updated data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "clients/דיאט אנגל/campaigns/working/dashboard/data.json"
          git diff --staged --quiet || git commit -m "chore: refresh Diet Angel dashboard data"
          git push
